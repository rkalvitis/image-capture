[workspace]
name = "optitrack"
version = "0.1.0"
authors = ["Luca Crupi <luca.crupi@icloud.com>", "Elia Cereda <elia.cereda@gmail.com>"]
channels = ["conda-forge", "robostack-humble"]
platforms = ["osx-arm64", "linux-aarch64"]
preview = ["pixi-build"]

# ──────────────────────────────────────────────────────────────────────────
# Feature: optitrack
#   Conda deps (ROS 2 Humble via RoboStack) + PyPI deps (natnet_py & the
#   optitrack_msgs stub installed editable from src/).
# ──────────────────────────────────────────────────────────────────────────

[feature.optitrack.dependencies]
python = "3.12.*"
ros-humble-ros-base = "*"
ros-humble-tf2-ros = "*"
ros-humble-tf2-geometry-msgs = "*"
ros-humble-python-orocos-kdl-vendor = "*"
ros-humble-rviz2 = "*"

natnet_py = { path = "src/natnet_py" }
ros-humble-optitrack-msgs = { path = "src/optitrack_msgs/package.xml" }
ros-humble-optitrack-ros-py = { path = "src/optitrack_ros_py/package.xml" }
ros-humble-optitrack-listener = { path = "src/optitrack_listener/package.xml" }

[environments]
default = { features = ["optitrack"] }

# ──────────────────────────────────────────────────────────────────────────
# Tasks
#   pixi run launch        — start driver + listener (builds first)
#   pixi run rviz-optitrack  — launch RViz with saved config
# ──────────────────────────────────────────────────────────────────────────

[tasks.launch]
description = "Run the OptiTrack driver + example listener (builds automatically if needed)."
cmd = "ros2 launch optitrack_listener optitrack.launch.py"

[tasks.rviz-optitrack]
description = "Launch RViz with the saved Optitrack config."
cmd = "rviz2 -d rviz/optitrack.rviz"

[feature.optitrack.activation.env]
OPTITRACK_PC_IP = "192.168.201.5"
MY_IP = "192.168.201.89"
