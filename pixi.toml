[workspace]
authors = ["Luca Crupi <luca.crupi@icloud.com>", "Elia Cereda <elia.cereda@gmail.com>"]
channels = ["conda-forge"]
name = "optitrack"
platforms = ["osx-arm64", "linux-aarch64"]
version = "0.1.0"

# ──────────────────────────────────────────────────────────────────────────
# Feature: optitrack
#   Conda deps (ROS 2 Humble via RoboStack) + PyPI deps (natnet_py installed
#   editable from src/). The ament_python / ament_cmake packages under src/ are
#   colcon-built (see the `build` task), not pip-installed.
#
#   NB: Python is pinned to 3.11 — the Orbbec camera SDK (pyorbbecsdk) ships no
#   wheel past cp311. This is why the workspace stays on the colcon build model
#   rather than master's pixi-build model, which would force the ROS distro to
#   Python 3.12 (via ros2-distro-mutex) and make pyorbbecsdk unsatisfiable.
# ──────────────────────────────────────────────────────────────────────────
[feature.optitrack]
channels = ["conda-forge", "robostack-humble"]

[feature.optitrack.dependencies]
python = "3.11.*"
ros-humble-ros-base = "*"
ros-humble-tf2-ros = "*"
ros-humble-tf2-geometry-msgs = "*"
ros-humble-python-orocos-kdl-vendor = "*"
ros-humble-rviz2 = "*"
# Needed to colcon-build the optitrack_msgs interface package (msg/*.msg).
# numpy is required by rosidl_generator_py's find_package(Python ... NumPy).
ros-humble-rosidl-default-generators = "*"
numpy = "*"
colcon-common-extensions = "*"
compilers = "*"
# cmake pinned <4: ROS 2 Humble's rosidl_generator_py (used to build the
# optitrack_msgs interface package) relies on Python-finding cmake modules that
# cmake 4 removed (policy CMP0148), breaking message generation.
cmake = ">=3.16,<4"
pkg-config = "*"
make = "*"
ninja = "*"
git = "*"
pip = "*"
# PNG writing in scripts/export_dataset.py (16-bit depth + RGB).
pillow = ">=10"

[feature.optitrack.pypi-dependencies]
# natnet_py: Jerome Guzzi's pure-Python NatNet client. Editable install from
# src/ so the (one-line) patch in scripts/patch_natnet.py stays applied.
natnet_py = { path = "src/natnet_py", editable = true }
# Runtime dep of natnet_py — also pulled in transitively, listed here for clarity.
netifaces = ">=0.11"
# NB: optitrack_ros_py, optitrack_listener, orbbec_camera_ros and the real
# optitrack_msgs package are NOT listed here. They're ament ROS 2 packages;
# pip's editable install would skip their data_files / message generation, so
# the ament_index would have no record of them and `ros2 launch` couldn't find
# them. Instead they're colcon-built via the implicit `build` task that
# `launch`/`camera`/`record` depend on — data_files land in the right place.

# Orbbec Femto Mega SDK — universal2 wheel, published for macOS arm64 only
# (cp36–cp311, no cp312). Scoped to osx-arm64 so the linux-aarch64 environment
# stays resolvable; the camera pipeline is macOS-only anyway.
[feature.optitrack.target.osx-arm64.pypi-dependencies]
pyorbbecsdk = ">=1.3.2"

[environments]
default = { features = ["optitrack"] }

# Lab defaults for the OptiTrack driver. ROS_LOCALHOST_ONLY: all ROS nodes run
# on this Mac (NatNet to the OptiTrack PC is plain UDP, not DDS). Off the lab
# LAN, CycloneDDS binds the wrong interface and local nodes never discover each
# other (empty bags, hanging `ros2 topic list`) — pinning DDS to loopback fixes
# that everywhere.
[feature.optitrack.activation.env]
OPTITRACK_PC_IP = "192.168.201.5"
# MY_IP is intentionally NOT set here: the launch files auto-detect the local
# bind IP via a UDP connect() to the Motive PC (picks the right NIC even with
# DHCP). Setting it here would override a user's `MY_IP=... pixi run ...` too,
# because activation env wins over the inherited shell env.
ROS_LOCALHOST_ONLY = "1"

# ──────────────────────────────────────────────────────────────────────────
# Tasks
#   pixi run patch-natnet       — idempotent one-line fix to natnet_py
#   pixi run build              — colcon build the ROS 2 workspace
#   pixi run launch             — start driver + listener (no camera, no bag)
#   pixi run camera             — start ONLY the Orbbec camera node
#                                 NOTE: requires root, like `record`
#   pixi run record             — start driver + camera + rosbag recording
#                                 NOTE: requires root (macOS UVC driver conflict)
#                                 First time: sudo pixi run record
#                                 After setup-usb-perms: pixi run record
#   pixi run record-mock        — same pipeline with synthetic data (no hardware)
#   pixi run export -- <bag>    — bag → PNGs + per-frame pose CSV
#   pixi run setup-usb-perms    — one-time grant of passwordless sudo for record
#   pixi run rviz-optitrack     — launch RViz with saved config
# ──────────────────────────────────────────────────────────────────────────
[tasks.patch-natnet]
description = "(implementation detail of `build`) idempotent natnet_py upstream fix."
cmd = "python scripts/patch_natnet.py"

[tasks.build]
description = "(implementation detail of `launch`) colcon build the ROS 2 workspace."
# The -DPython*_EXECUTABLE hints are needed by optitrack_msgs' message
# generation: rosidl_generator_py runs FindPythonExtra before FindPython, which
# leaves the modern find_package(Python) unable to locate the conda interpreter
# on macOS unless the path is given explicitly. Harmless for the ament_python
# packages, which ignore cmake args.
cmd = "bash -c 'colcon build --cmake-args -DPython3_EXECUTABLE=\"$CONDA_PREFIX/bin/python\" -DPython_EXECUTABLE=\"$CONDA_PREFIX/bin/python\" -DPYTHON_EXECUTABLE=\"$CONDA_PREFIX/bin/python\"'"
depends-on = ["patch-natnet"]

[tasks.launch]
description = "Run the OptiTrack driver + example listener (builds automatically if needed)."
cmd = "bash -c 'source install/setup.bash && ros2 launch optitrack_listener optitrack.launch.py'"
depends-on = ["build"]

[tasks.camera]
description = "Run only the Orbbec Femto Mega camera node (no OptiTrack, no bag). Needs root (see setup-usb-perms)."
# Same chown trick as `record`: hand root-owned build artifacts back to the
# real user so the next non-sudo build doesn't fail with EPERM.
cmd = "bash -c 'source install/setup.bash && ros2 launch optitrack_listener camera.launch.py; [ -n \"${SUDO_USER:-}\" ] && chown -R \"$SUDO_USER\" build install log || true'"
depends-on = ["build"]

[tasks.record]
description = "Record OptiTrack poses + Orbbec camera to a rosbag. Needs root (see setup-usb-perms)."
# The trailing chown hands everything the root process touched (bag, colcon
# build artifacts, logs) back to the real user — otherwise the next non-sudo
# build fails with EPERM on root-owned files.
cmd = "bash -c 'source install/setup.bash && ros2 launch optitrack_listener record.launch.py; [ -n \"${SUDO_USER:-}\" ] && chown -R \"$SUDO_USER\" build install log datasets || true'"
depends-on = ["build"]

[tasks.record-mock]
description = "Test the recording pipeline with synthetic camera + pose data (no hardware, no sudo)."
cmd = "bash -c 'source install/setup.bash && MOCK_RECORD=1 ros2 launch optitrack_listener record.launch.py'"
depends-on = ["build"]

[tasks.export]
description = "Export a recorded bag to PNGs + per-frame pose CSV. Usage: pixi run export -- datasets/<bag> [--rigid-body NAME] [--time-offset SEC]"
cmd = "python scripts/export_dataset.py"

[tasks.setup-usb-perms]
description = "One-time: grant passwordless sudo so 'pixi run record' works without a password prompt."
cmd = "sudo bash scripts/setup_usb_permissions.sh"

[tasks.rviz-optitrack]
description = "Launch RViz with the saved Optitrack config."
cmd = "rviz2 -d rviz/optitrack.rviz"
